openapi: 3.0.3
info:
  title: Mentoroid In-Game Coaching API
  version: 2.2.0
  description: |
    ## Overview
    | Service | Port | Purpose |
    |---------|------|---------|
    | Coaching Backend | 39144 | Pipeline control, player setup |
    | GSI Handler | 19151 | Dota 2 Game State Integration |
    | Match Events | 18100 | Flutter implements this server |

    ## What's New

    ### v2.3.0 — Sentry Telemetry
    - **Consent-gated telemetry:** `POST /set_player` accepts optional `firebase_uid` to enable Sentry error tracking and performance checkpoints
    - **4 phased checkpoints** collecting system info, draft data, in-game coaching stats, and match results
    - **Error capture** across all modules (pipeline, GSI, TTS, OCR, YOLO, hero selection)

    ### v2.2.0 — TTS Toggle & Payload Cleanup
    - `POST /tts_toggle` and `GET /tts_status` for enabling/disabling TTS globally
    - Match end payload field renames: `result`, `duration_seconds`, `net_worth`, `last_hits`, `kills`/`deaths`/`assists`
    - New fields: `steam_id`, `is_radiant`, `start_time`, `gold`, `gpm`

    ### v2.1.0 — Voice Packs
    - `POST /voice_set`, `GET /voice_get`, `GET /voice_list`, `POST /voice_sample`
    - Two voices: `bella` (female), `michael` (male)

    ### v2.0.0 — Full Automation
    - Auto-detection watcher (Dota opens → start, closes → stop)
    - `/start` and `/stop` are now optional

    ## Flutter Integration Flow
    1. `GET /ready` — Check backend is running
    2. `GET /player_info` — Check if Steam ID is configured
    3. `POST /set_player` — Set Steam ID + optional `firebase_uid` for telemetry
    4. **Done** — Auto-detection handles everything else

    Backend will automatically POST to Flutter's `/match_started` and `/match_end` endpoints.

    ## Telemetry (Sentry)

    ### Consent Model
    Sentry is **never initialized at startup**. It activates only when `POST /set_player`
    includes a non-empty `firebase_uid`. Providing a Firebase UID = consent to telemetry.
    No UID = no Sentry. All telemetry calls are safe no-ops when Sentry is inactive.

    **Identity:** Firebase UID only (opaque, no PII). Steam IDs are scrubbed from all
    Sentry payloads via regex before transmission.

    ### Checkpoints
    Four independent Sentry transactions sent at key lifecycle points. Each is immediately
    flushed to ensure delivery even if the app crashes afterward.

    | # | Name | Trigger |
    |---|------|---------|
    | 1 | `checkpoint.startup` | After model loading (deferred if Sentry not yet enabled) |
    | 2 | `checkpoint.draft` | Once when in-game phase begins |
    | 3 | `checkpoint.ingame` | Every 10 minutes of game clock |
    | 4 | `checkpoint.match_end` | After match end data is sent |

    <details>
    <summary><strong>Checkpoint 1 — Startup</strong> (system info + model load time)</summary>

    Tags:
    ```
    os: "windows"
    os_version: "10"
    os_arch: "AMD64"
    python_version: "3.10.11"
    is_frozen: "true"
    cpu_name: "AMD64 Family 23 Model 24 Stepping 1, AuthenticAMD"
    cpu_cores_physical: "4"
    cpu_cores_logical: "8"
    ram_total_gb: "13.9"
    ram_available_gb: "6.9"
    gpu_count: "2"
    gpu_0_name: "Radeon RX 5500M"
    gpu_0_vram_gb: "4.0"
    gpu_1_name: "AMD Radeon(TM) RX Vega 10 Graphics"
    gpu_1_vram_gb: "2.0"
    gpu_vram_total_gb: "6.0"
    gpu_accel: "CPU_only"
    onnx_providers: "AzureExecutionProvider,CPUExecutionProvider"
    primary_resolution: "1920x1080"
    monitor_count: "2"
    yolo_provider: "CPUExecutionProvider"
    ocr_available: "true"
    ocr_gpu: "true"
    tts_voice: "bella"
    ```
    Measurements:
    ```
    model_load_ms: 5028.4
    ```
    </details>

    <details>
    <summary><strong>Checkpoint 2 — Draft</strong> (team composition + hero suggestions)</summary>

    Tags:
    ```
    match_id: "8725198582"
    team: "radiant"
    detected_role: "Offlane"
    recommendation_role: "offlane"
    role_detection_method: "profile_fallback"
    enemy_team: "Marci,Bane,Sand King,Bristleback"
    enemy_team_count: "4"
    hero_suggestions: "Axe,Legion Commander,Mars"
    hero_suggestion_count: "3"
    ```
    </details>

    <details>
    <summary><strong>Checkpoint 3 — In-Game</strong> (economy + all 20 TTS prompt statuses)</summary>

    Tags:
    ```
    match_id: "8725198582"
    team: "radiant"
    player_role: "Offlane"
    game_time_minutes: "10"
    kills: "0"
    deaths: "0"
    assists: "0"
    prompt_lane_strategy: "skipped"
    prompt_role_job: "skipped"
    prompt_bounty_rune: "skipped"
    prompt_block_enemy_pull: "fired"
    prompt_prioritize_harass: "fired"
    prompt_check_pull_camp: "fired"
    prompt_enemy_harass_spell: "fired"
    prompt_night_observer: "fired"
    prompt_power_rune: "fired"
    prompt_wisdom_shrine: "fired"
    prompt_lane_pushing: "fired"
    prompt_lasthit_tracking: "skipped"
    prompt_lasthit_falling: "skipped"
    prompt_communicate: "fired"
    prompt_mid_block_creep: "skipped"
    prompt_mid_secure_creep: "skipped"
    prompt_mid_extra_ward: "skipped"
    prompt_mid_ask_support: "skipped"
    prompt_offlane_lasthit: "skipped"
    prompt_offlane_coordinate: "skipped"
    ```
    Measurements:
    ```
    game_time_seconds: 601.0
    gold: 875.0
    gpm: 1378.0
    xpm: 1101.0
    ```
    </details>

    <details>
    <summary><strong>Checkpoint 4 — Match End</strong> (result + performance + prompt summary)</summary>

    Tags:
    ```
    match_id: "8725198582"
    team: "radiant"
    hero_id: "35"
    player_role: "Offlane"
    result: "Won"
    match_duration_minutes: "17"
    role_detection_method: "profile_fallback"
    hero_suggestions: "Axe,Legion Commander,Mars"
    prompts_fired: "block_enemy_pull,prioritize_harass,check_pull_camp,enemy_harass_spell,night_observer,power_rune,wisdom_shrine,lane_pushing,communicate"
    prompts_fired_count: "9"
    prompts_skipped: "lane_strategy,role_job,bounty_rune,lasthit_tracking,lasthit_falling,mid_block_creep,mid_secure_creep,mid_extra_ward,mid_ask_support,offlane_lasthit,offlane_coordinate"
    prompts_skipped_count: "11"
    ```
    Measurements:
    ```
    duration_seconds: 1031.0
    kills: 0.0
    deaths: 0.0
    assists: 0.0
    last_hits: 136.0
    gpm: 1588.0
    xpm: 894.0
    ```
    </details>

    ### Error Collection
    - All exceptions captured via `capture_exception_safe()` (never crashes the app)
    - Breadcrumbs track state transitions, API calls, model inference, TTS prompts
    - Performance spans measure YOLO inference, OCR detection, TTS generation, hero recommendation compute time

    ## Auto-Detection Watcher
    The watcher monitors for the Dota 2 process:
    - **Dota 2 Opens** -> Pipeline auto-starts, GSI begins receiving data
    - **Dota 2 Closes** -> Pipeline auto-stops, resources cleaned up
    - No polling required from Flutter side

    ## Flutter Server Requirements (Port 18100)
    Flutter must implement a local HTTP server on port 18100 with two POST endpoints.
    The coaching backend will call these endpoints automatically during gameplay.

    ## GSI Setup (Windows)

    ### Step 1: Create config folder
    Navigate to your Dota 2 cfg folder and create the GSI folder:
    ```
    C:\Program Files (x86)\Steam\steamapps\common\dota 2 beta\game\dota\cfg\gamestate_integration\
    ```

    ### Step 2: Create config file
    Inside gamestate_integration folder, create `gamestate_integration_mentoroid.cfg`:
    ```
    "Dota 2 Integration Configuration"
    {
        "uri"          "http://localhost:19151/"
        "timeout"      "5.0"
        "buffer"       "0.1"
        "throttle"     "0.1"
        "heartbeat"    "10.0"
        "data"
        {
            "auth"            "mentoroid_gsi"
            "provider"        "1"
            "map"             "1"
            "player"          "1"
            "hero"            "1"
            "abilities"       "1"
            "items"           "1"
            "events"          "1"
            "buildings"       "1"
            "league"          "1"
            "draft"           "1"
            "wearables"       "1"
            "minimap"         "1"
            "roshan"          "1"
            "couriers"        "1"
            "neutralitems"    "1"
        }
    }
    ```

    ### Step 3: Enable in Dota 2
    In Dota 2: Settings -> Social -> Enable "Share match data with third-party sources"

servers:
  - url: http://localhost:39144
    description: Coaching Backend
  - url: http://localhost:18100
    description: Match Events (Flutter Server)
  - url: http://localhost:19151
    description: GSI Handler
  - url: https://dev.mentoroid.ai
    description: Mentoroid Orchestrator (Dev)

tags:
  - name: Player Setup
    description: One-time player configuration endpoints
  - name: Status
    description: Health check and status monitoring endpoints
  - name: Pipeline Control
    description: Manual pipeline control (optional - auto-detection handles this)
  - name: TTS Control
    description: TTS enable/disable and volume control
  - name: Voice Control
    description: TTS voice pack selection and preview
  - name: Match Events (Flutter Server)
    description: Webhooks that Flutter must implement to receive match data
  - name: Backend Events (Orchestrator)
    description: Endpoints that Binary calls on Mentoroid Backend for PGA processing

paths:
  /set_player:
    post:
      tags: [Player Setup]
      summary: Set Steam ID
      description: |
        Configure the Steam ID for the player. This is a **one-time setup** required before coaching can begin.
        The backend uses this to identify the player in GSI data and fetch player statistics.

        **Telemetry consent:** Pass `firebase_uid` to enable Sentry error tracking and performance
        telemetry. Omitting it or sending an empty string keeps telemetry disabled.

        **To replace an existing Steam ID:**
        - Pass `force: true` in the request body
        - Without force, returns error if Steam ID already set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlayerRequest'
            examples:
              basic:
                summary: First time setup (with telemetry consent)
                value:
                  steam_id: "76561197960272226"
                  api_key: "mentoroid_api_key_here"
                  firebase_uid: "ecJyqObrhNPDTJ6JfcOnVhTflui2"
              without_telemetry:
                summary: Setup without telemetry
                value:
                  steam_id: "76561197960272226"
                  api_key: "mentoroid_api_key_here"
              force_override:
                summary: Override existing Steam ID
                value:
                  steam_id: "76561197960272226"
                  api_key: "mentoroid_api_key_here"
                  firebase_uid: "ecJyqObrhNPDTJ6JfcOnVhTflui2"
                  force: true
      responses:
        "200":
          description: Steam ID set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPlayerResponse'
              example:
                status: success
                player_name: Wile
                steam_id: "76561197960272226"
                win_rate: 52.5
                current_rank: "Archon"
                selected_roles: ["Carry", "Mid"]
                prefered_heroes: [1, 35, 74]
                message: "Player data loaded and saved successfully"
        "400":
          description: Missing required field
          content:
            application/json:
              examples:
                missing_steam_id:
                  summary: Only API key provided (missing Steam ID)
                  value:
                    status: error
                    message: "Steam ID is required"
                missing_api_key:
                  summary: Only Steam ID provided (missing API key)
                  value:
                    status: error
                    message: "API key is required"
        "409":
          description: Steam ID already set (use force=true to override)
          content:
            application/json:
              example:
                status: already_set
                current_steam_id: "76561197960272226"
                message: Steam ID already set. Use force=true to override.

  /player_info:
    get:
      tags: [Player Setup]
      summary: Get player info
      description: |
        Retrieve the currently configured player information.
        Use this to check if Steam ID has been set before prompting user for setup.
      responses:
        "200":
          description: Player info retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerInfoResponse'
              example:
                status: loaded
                player_name: Wile
                win_rate: 52.5
                current_rank: "Archon"
                selected_roles: ["Carry", "Mid"]
                prefered_heroes: [1, 35, 74]
                start_data:
                  selected_roles: ["Carry", "Mid"]
                  selected_heroes: []
                  guidance_options: {}
                  current_rank: "Archon"
                  prefered_hero_from_win_rate: [1, 35, 74]

  /ready:
    get:
      tags: [Status]
      summary: Check backend ready
      description: |
        Health check endpoint to verify the coaching backend is running and responsive.
        Use this on app startup to ensure the backend service is available.
      responses:
        "200":
          description: Backend status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                ready: true
                running: false

  /watcher_status:
    get:
      tags: [Status]
      summary: Get watcher status
      description: |
        Check the status of the Dota 2 process watcher.
        Returns whether the watcher is active and if Dota 2 is currently detected.
      responses:
        "200":
          description: Watcher status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatcherStatusResponse'
              example:
                watcher_running: true
                dota_detected: true

  /start:
    post:
      tags: [Pipeline Control]
      summary: Manual start (optional)
      description: |
        **Optional** - The auto-detection watcher handles this automatically.
        Manually start the coaching pipeline. Only use this if you need to override
        the automatic behavior or for testing purposes.

        **No longer required due to automation:**
        - No request body or parameters needed
        - Pipeline starts automatically when Dota 2 opens
        - Match detection handled via GSI
        - Hero detection handled via GSI
      responses:
        "200":
          description: Pipeline started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineResponse'
              example:
                status: started

  /stop:
    post:
      tags: [Pipeline Control]
      summary: Manual stop (optional)
      description: |
        **Optional** - The auto-detection watcher handles this automatically.
        Manually stop the coaching pipeline. Only use this if you need to override
        the automatic behavior or for testing purposes.

        **No longer required due to automation:**
        - No request body or parameters needed
        - Pipeline stops automatically when Dota 2 closes
        - All resources cleaned up automatically
        - Match end data sent before shutdown
      responses:
        "200":
          description: Pipeline stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineResponse'
              example:
                status: stopped

  /volume_set:
    post:
      tags: [TTS Control]
      summary: Set TTS volume
      description: |
        Set the text-to-speech volume for coaching audio feedback.
        Volume range is 0 (mute) to 100 (maximum).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeSetRequest'
            example:
              volume: 75
      responses:
        "200":
          description: Volume set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeResponse'
              example:
                status: success
                volume: 75

  /volume_get:
    get:
      tags: [TTS Control]
      summary: Get TTS volume
      description: |
        Get the current text-to-speech volume setting.
      responses:
        "200":
          description: Current volume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeResponse'
              example:
                status: success
                volume: 75

  /tts_toggle:
    post:
      tags: [TTS Control]
      summary: Enable or disable TTS
      description: |
        Enable or disable text-to-speech globally. When disabled, all `speak()` calls
        are silently ignored - no audio is generated or played.

        Useful for muting coaching audio without changing volume.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSToggleRequest'
            examples:
              disable:
                summary: Disable TTS
                value:
                  enabled: false
              enable:
                summary: Enable TTS
                value:
                  enabled: true
      responses:
        "200":
          description: TTS state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSToggleResponse'
              examples:
                disabled:
                  summary: TTS disabled
                  value:
                    status: success
                    enabled: false
                    message: "TTS disabled"
                enabled:
                  summary: TTS enabled
                  value:
                    status: success
                    enabled: true
                    message: "TTS enabled"

  /tts_status:
    get:
      tags: [TTS Control]
      summary: Get TTS enabled state
      description: |
        Check whether TTS is currently enabled or disabled.
      responses:
        "200":
          description: Current TTS state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSStatusResponse'
              examples:
                enabled:
                  summary: TTS is enabled
                  value:
                    status: success
                    enabled: true
                disabled:
                  summary: TTS is disabled
                  value:
                    status: success
                    enabled: false

  /voice_set:
    post:
      tags: [Voice Control]
      summary: Set TTS voice pack
      description: |
        Set the text-to-speech voice pack. Changes take effect on next audio playback.

        **Available voices:**
        - `bella` - Female voice
        - `michael` - Male voice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceSetRequest'
            examples:
              set_bella:
                summary: Set female voice (Bella)
                value:
                  voice: "bella"
              set_michael:
                summary: Set male voice (Michael)
                value:
                  voice: "michael"
      responses:
        "200":
          description: Voice set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSetResponse'
              examples:
                bella_response:
                  summary: Bella voice set
                  value:
                    status: success
                    voice: "bella"
                    message: "Voice set to 'bella'"
                michael_response:
                  summary: Michael voice set
                  value:
                    status: success
                    voice: "michael"
                    message: "Voice set to 'michael'"
        "400":
          description: Invalid voice pack
          content:
            application/json:
              example:
                status: error
                message: "Invalid voice 'invalid'. Available: ['bella', 'michael']"

  /voice_get:
    get:
      tags: [Voice Control]
      summary: Get current voice pack
      description: |
        Get the currently selected TTS voice pack and list of available options.
      responses:
        "200":
          description: Current voice info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceGetResponse'
              examples:
                bella_selected:
                  summary: Bella voice selected
                  value:
                    status: success
                    voice: "bella"
                    available_voices: ["bella", "michael"]
                michael_selected:
                  summary: Michael voice selected
                  value:
                    status: success
                    voice: "michael"
                    available_voices: ["bella", "michael"]

  /voice_list:
    get:
      tags: [Voice Control]
      summary: List all voice packs
      description: |
        Get a list of all available voice packs with metadata (name, description).
      responses:
        "200":
          description: List of voice packs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceListResponse'
              example:
                status: success
                voices:
                  - id: "bella"
                    name: "Bella"
                    description: "Female voice"
                  - id: "michael"
                    name: "Michael"
                    description: "Male voice"
                total: 2

  /voice_sample:
    post:
      tags: [Voice Control]
      summary: Preview voice pack
      description: |
        Play a sample audio for the specified voice pack without changing the current setting.
        Uses Kokoro TTS to generate and play "welcome to mentoroid" in the specified voice.

        If no voice is specified, plays sample using the current voice.

        **Does NOT change the current voice setting** - just previews the voice.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceSetRequest'
            examples:
              preview_bella:
                summary: Preview Bella voice (female)
                value:
                  voice: "bella"
              preview_michael:
                summary: Preview Michael voice (male)
                value:
                  voice: "michael"
      responses:
        "200":
          description: Sample playing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSampleResponse'
              examples:
                bella_sample:
                  summary: Bella voice sample
                  value:
                    status: success
                    voice: "bella"
                    message: "Playing sample for 'bella' voice"
                michael_sample:
                  summary: Michael voice sample
                  value:
                    status: success
                    voice: "michael"
                    message: "Playing sample for 'michael' voice"
        "400":
          description: Invalid voice pack
          content:
            application/json:
              example:
                status: error
                message: "Invalid voice 'invalid'. Available: ['bella', 'michael']"

  /match_started:
    post:
      tags: [Match Events (Flutter Server)]
      summary: Match started webhook
      description: |
        **Flutter must implement this endpoint.**
        Called by the coaching backend when a new match is detected.
        Use this to update UI, start tracking, or initialize match-specific features.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchStartedRequest'
            example:
              match_id: "8648059066"
      responses:
        "200":
          description: Acknowledge receipt
          content:
            application/json:
              example:
                status: ok

  /match_end:
    post:
      tags: [Match Events (Flutter Server)]
      summary: Match ended webhook
      description: |
        **Flutter must implement this endpoint.**
        Called by the coaching backend when a match ends. Contains comprehensive
        session data including hero played, game outcome, statistics, and performance metrics.
        Use this to display post-game summary, save match history, or trigger analytics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchEndRequest'
            examples:
              win_example:
                summary: Match won
                value:
                  match_id: "8696654341"
                  session_data:
                    steam_id: 76561198377048915
                    hero_id: 35
                    is_radiant: true
                    hero_facet: 1
                    Facet_Selected: "Ghillie Suit"
                    result: "Won"
                    role: "Hard Support"
                    duration_seconds: 937.0
                    start_time: 1771455092
                    date: "2026-02-19 04:40:06"
                    net_worth: 11933
                    gold: 1233
                    gpm: 493
                    xpm: 442.0
                    last_hits: 92
                    denies: 0
                    kill_participant: 7.69
                    death_participant: 0.0
                    kills: 1
                    deaths: 0
                    assists: 0
                    observer_ward: 0
                    sentry_ward: 0
              lose_example:
                summary: Match lost
                value:
                  match_id: "8648059067"
                  session_data:
                    steam_id: 76561198377048915
                    hero_id: 74
                    is_radiant: false
                    hero_facet: 2
                    Facet_Selected: "Reflective Counter"
                    result: "Lost"
                    role: "Carry"
                    duration_seconds: 1823.0
                    start_time: 1736150521
                    date: "2026-01-14 01:15:32"
                    net_worth: 15230
                    gold: 2150
                    gpm: 501
                    xpm: 612.0
                    last_hits: 185
                    denies: 12
                    kill_participant: 45.0
                    death_participant: 38.0
                    kills: 5
                    deaths: 9
                    assists: 7
                    observer_ward: 0
                    sentry_ward: 0
      responses:
        "200":
          description: Acknowledge receipt
          content:
            application/json:
              example:
                status: ok

  /session_end:
    post:
      tags: [Match Events (Flutter Server)]
      summary: Session ended webhook
      description: |
        **Flutter must implement this endpoint.**
        Called by the coaching backend when the Dota 2 session ends. This is triggered in two scenarios:
        1. **Dota 2 closes** - The auto-detection watcher detects `dota2.exe` is no longer running
        2. **Manual `/stop` call** - Pipeline is manually stopped via the API

        This is sent **after** any `/match_end` webhook (if a match was in progress).
        Use this to update UI state, show session summary, or cleanup resources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEndRequest'
            example:
              status: "session_ended"
      responses:
        "200":
          description: Acknowledge receipt
          content:
            application/json:
              example:
                status: ok

  /update_match:
    post:
      tags: [Backend Events (Orchestrator)]
      summary: Send match data to Orchestrator
      description: |
        **Binary calls this endpoint on Mentoroid Backend.**
        Called by the coaching binary when a match ends. Sends match session data
        to the Orchestrator for PGA (Post-Game Analysis) processing.

        **Base URL:** `https://dev.mentoroid.ai`

        **Authentication:** Requires `X-API-Key` header (from config.json)

        **Note:** The backend automatically sets `coached: true` for matches
        received via this endpoint (since they came from the Binary client).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMatchRequest'
            example:
              match_id: "8648059066"
              steam_id: "76561198047160218"
              hero_id: 35
              is_radiant: true
              result: "Won"
              duration_seconds: 2145
              start_time: 1736150521
              net_worth: 20491
              gold: 1250
              xpm: 935
              gpm: 692
              last_hits: 61
              denies: 5
              kills: 8
              deaths: 3
              assists: 22
      responses:
        "200":
          description: Match received and queued for PGA processing
          content:
            application/json:
              example:
                status: "success"
                message: "Match received and queued for processing"
                match_id: "8648059066"
        "400":
          description: Missing required fields
          content:
            application/json:
              example:
                error: "Missing required fields"
                missing: ["hero_id", "steam_id"]
        "404":
          description: User not registered
          content:
            application/json:
              example:
                error: "User not registered. Please call /signup first."
                steam_id: "76561198047160218"

components:
  schemas:
    SetPlayerRequest:
      type: object
      required:
        - steam_id
        - api_key
      properties:
        steam_id:
          type: string
          description: Steam ID in 64-bit format
          example: "76561197960272226"
        api_key:
          type: string
          description: Mentoroid API key (required for authentication)
          example: "mentoroid_api_key_here"
        firebase_uid:
          type: string
          default: ""
          description: |
            Firebase Auth UID. When non-empty, enables Sentry telemetry (error tracking
            and performance checkpoints). Omit or send empty string to opt out.
          example: "ecJyqObrhNPDTJ6JfcOnVhTflui2"
        force:
          type: boolean
          default: false
          description: Set to true to override an existing Steam ID
          example: false

    SetPlayerResponse:
      type: object
      properties:
        status:
          type: string
          description: Operation result
          example: success
        player_name:
          type: string
          description: Player's Steam display name
          example: Wile
        steam_id:
          type: string
          description: Steam ID that was set
          example: "76561197960272226"
        win_rate:
          type: number
          format: float
          description: Player's overall win rate percentage
          example: 52.5
        current_rank:
          type: string
          description: Player's current rank
          example: "Archon"
        selected_roles:
          type: array
          items:
            type: string
          description: Player's preferred roles
          example: ["Carry", "Mid"]
        prefered_heroes:
          type: array
          items:
            type: integer
          description: Hero IDs of player's preferred heroes (by win rate)
          example: [1, 35, 74]
        message:
          type: string
          description: Confirmation message
          example: "Player data loaded and saved successfully"

    PlayerInfoResponse:
      type: object
      properties:
        status:
          type: string
          description: Load status ("loaded" or "not_loaded")
          example: loaded
        player_name:
          type: string
          description: Player's Steam display name
          example: Wile
        win_rate:
          type: number
          format: float
          description: Player's overall win rate percentage
          example: 52.5
        current_rank:
          type: string
          description: Player's current rank
          example: "Archon"
        selected_roles:
          type: array
          items:
            type: string
          description: Player's preferred roles
          example: ["Carry", "Mid"]
        prefered_heroes:
          type: array
          items:
            type: integer
          description: Hero IDs of player's preferred heroes (by win rate)
          example: [1, 35, 74]
        start_data:
          type: object
          description: Data object passed to pipeline on start
          properties:
            selected_roles:
              type: array
              items:
                type: string
            selected_heroes:
              type: array
              items:
                type: integer
            guidance_options:
              type: object
            current_rank:
              type: string
            prefered_hero_from_win_rate:
              type: array
              items:
                type: integer

    ReadyResponse:
      type: object
      properties:
        ready:
          type: boolean
          description: Whether backend is ready to accept requests
          example: true
        running:
          type: boolean
          description: Whether coaching pipeline is currently running
          example: false

    WatcherStatusResponse:
      type: object
      properties:
        watcher_running:
          type: boolean
          description: Whether the Dota 2 process watcher is active
          example: true
        dota_detected:
          type: boolean
          description: Whether Dota 2 process is currently detected
          example: true

    PipelineResponse:
      type: object
      properties:
        status:
          type: string
          enum: [started, stopped]
          description: Pipeline state after operation
          example: started

    VolumeSetRequest:
      type: object
      required:
        - volume
      properties:
        volume:
          type: integer
          minimum: 0
          maximum: 100
          description: TTS volume level (0-100)
          example: 75

    VolumeResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        volume:
          type: integer
          description: Current volume level
          example: 75

    VoiceSetRequest:
      type: object
      required:
        - voice
      properties:
        voice:
          type: string
          enum: ["bella", "michael"]
          description: Voice pack ID
          example: "bella"

    VoiceSetResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        voice:
          type: string
          description: Selected voice pack ID
          example: "bella"
        message:
          type: string
          description: Confirmation message
          example: "Voice set to 'bella'"

    VoiceGetResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        voice:
          type: string
          description: Currently selected voice pack ID
          example: "bella"
        available_voices:
          type: array
          items:
            type: string
          description: List of available voice pack IDs
          example: ["bella", "michael"]

    VoiceListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        voices:
          type: array
          items:
            $ref: '#/components/schemas/VoiceInfo'
          description: List of available voice packs with metadata
        total:
          type: integer
          description: Total number of available voices
          example: 2

    VoiceInfo:
      type: object
      properties:
        id:
          type: string
          description: Voice pack ID
          example: "bella"
        name:
          type: string
          description: Display name
          example: "Bella"
        description:
          type: string
          description: Voice description
          example: "Female voice"

    VoiceSampleResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        voice:
          type: string
          description: Voice pack being previewed
          example: "bella"
        message:
          type: string
          description: Confirmation message
          example: "Playing sample for 'bella' voice"

    TTSToggleRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Set to true to enable TTS, false to disable
          example: false

    TTSToggleResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        enabled:
          type: boolean
          description: Current TTS enabled state after toggle
          example: false
        message:
          type: string
          description: Confirmation message
          example: "TTS disabled"

    TTSStatusResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        enabled:
          type: boolean
          description: Whether TTS is currently enabled
          example: true

    MatchStartedRequest:
      type: object
      required:
        - match_id
      properties:
        match_id:
          type: string
          description: Dota 2 match ID
          example: "8648059066"

    MatchEndRequest:
      type: object
      required:
        - match_id
        - session_data
      properties:
        match_id:
          type: string
          description: Dota 2 match ID
          example: "8648059066"
        session_data:
          $ref: '#/components/schemas/SessionData'

    SessionEndRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Session status
          example: "session_ended"

    UpdateMatchRequest:
      type: object
      description: Match data sent to Orchestrator for PGA processing
      required:
        - match_id
        - steam_id
        - hero_id
        - is_radiant
        - result
        - duration_seconds
        - start_time
        - net_worth
        - gold
        - xpm
        - gpm
        - last_hits
        - denies
        - kills
        - deaths
        - assists
      properties:
        match_id:
          type: string
          description: Dota 2 match ID
          example: "8648059066"
        steam_id:
          type: string
          description: Player's Steam 64-bit ID
          example: "76561198047160218"
        hero_id:
          type: integer
          description: Dota 2 hero ID
          example: 35
        is_radiant:
          type: boolean
          description: True if player on Radiant, false if Dire
          example: true
        result:
          type: string
          enum: ["Won", "Lost"]
          description: Match outcome
          example: "Won"
        duration_seconds:
          type: integer
          description: Match duration in seconds
          example: 2145
        start_time:
          type: integer
          description: Unix timestamp when match started
          example: 1736150521
        net_worth:
          type: integer
          description: Final networth in gold
          example: 20491
        gold:
          type: integer
          description: Current gold at match end
          example: 1250
        xpm:
          type: integer
          description: Experience per minute
          example: 935
        gpm:
          type: integer
          description: Gold per minute
          example: 692
        last_hits:
          type: integer
          description: Total last hits
          example: 61
        denies:
          type: integer
          description: Total denies
          example: 5
        kills:
          type: integer
          description: Total kills
          example: 8
        deaths:
          type: integer
          description: Total deaths
          example: 3
        assists:
          type: integer
          description: Total assists
          example: 22

    SessionData:
      type: object
      description: Complete match session statistics
      properties:
        steam_id:
          type: integer
          description: Player's Steam 64-bit ID
          example: 76561198377048915
        hero_id:
          type: integer
          description: Dota 2 hero ID
          example: 35
        is_radiant:
          type: boolean
          description: True if player on Radiant, false if Dire
          example: true
        hero_facet:
          type: integer
          description: Selected hero facet number (1-based)
          example: 1
        Facet_Selected:
          type: string
          description: Name of the selected facet
          example: "Ghillie Suit"
        result:
          type: string
          enum: ["Won", "Lost"]
          description: Match outcome
          example: "Won"
        role:
          type: string
          enum: ["Carry", "Mid", "Offlane", "Soft Support", "Hard Support"]
          description: Player's role in the match
          example: "Hard Support"
        duration_seconds:
          type: number
          format: float
          description: Match duration in seconds
          example: 937.0
        start_time:
          type: integer
          description: Unix timestamp when match started
          example: 1771455092
        date:
          type: string
          description: Match end timestamp (YYYY-MM-DD HH:MM:SS)
          example: "2026-02-19 04:40:06"
        net_worth:
          type: integer
          description: Final networth at match end
          example: 11933
        gold:
          type: integer
          description: Current gold at match end
          example: 1233
        gpm:
          type: integer
          description: Gold per minute
          example: 493
        xpm:
          type: number
          format: float
          description: Experience per minute
          example: 442.0
        last_hits:
          type: integer
          description: Total last hits
          example: 92
        denies:
          type: integer
          description: Total denies
          example: 0
        kill_participant:
          type: number
          format: float
          description: Kill participation percentage (0.0 - 100.0)
          example: 7.69
        death_participant:
          type: number
          format: float
          description: Death participation percentage (0.0 - 100.0)
          example: 0.0
        kills:
          type: integer
          description: Total kills
          example: 1
        deaths:
          type: integer
          description: Total deaths
          example: 0
        assists:
          type: integer
          description: Total assists
          example: 0
        observer_ward:
          type: integer
          description: Observer wards placed
          example: 0
        sentry_ward:
          type: integer
          description: Sentry wards placed
          example: 0

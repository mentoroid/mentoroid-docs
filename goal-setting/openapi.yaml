openapi: 3.0.3
info:
  title: Mentoroid Goal Setting API
  description: |
    Pre-game focus area generation for Dota 2 players.

    ## Overview

    After each match is analyzed by the PGA pipeline (Stage 1), the Goal Setting service
    generates personalized focus areas for the player's top roles. These focus areas help
    players improve by highlighting specific areas to work on in their next game.

    ## Architecture

    | Component | Detail |
    |-----------|--------|
    | **Type** | Cloud Run service |
    | **LLM** | Claude (Anthropic) via `llm_framework` |
    | **Auth** | IAM service-to-service (internal), `X-API-Key` (external) |
    | **Trigger** | Called by `match_insights_handler` after Stage 1 output is saved |

    ## Pipeline Flow

    ```
    ┌────────────────────┐     ┌───────────────────┐     ┌──────────────┐
    │ match_insights     │     │   Goal Setting     │     │    Claude    │
    │ handler (CF)       │     │   (Cloud Run)      │     │    (LLM)     │
    └────────┬───────────┘     └─────────┬─────────┘     └──────┬───────┘
             │                           │                      │
             │ 1. Save output_llm/       │                      │
             │    {match_id}.json        │                      │
             │                           │                      │
             │ 2. POST /goal-setting     │                      │
             │    {steam_id, match_id}   │                      │
             │ ─────────────────────────>│                      │
             │                           │                      │
             │                           │ 3. Load profile      │
             │                           │    (roles, rank)     │
             │                           │                      │
             │                           │ 4. Load manifest     │
             │                           │    + Stage 1 outputs │
             │                           │                      │
             │                           │ 5. Generate goals    │
             │                           │ ────────────────────>│
             │                           │                      │
             │                           │ 6. Focus areas       │
             │                           │ <────────────────────│
             │                           │                      │
             │                           │ 7. Save to GCS       │
             │                           │    goal_setting/     │
             │                           │    {steam_id}/       │
             │                           │    {match_id}.json   │
             │                           │                      │
             │ 8. 200 OK {goals}         │                      │
             │ <─────────────────────────│                      │
    ```

    ## Role Resolution

    `roles` is a **required** query parameter. The request returns 400 if omitted.
    Provide 1-2 roles, e.g., `?roles=carry&roles=mid`.

    ## Personalization Threshold

    | Matches for Role | Behavior |
    |-----------------|----------|
    | < 5 | Static tips from `new_to_role.json` (no LLM) |
    | >= 5 | Personalized focus areas via LLM (last 20 matches) |

    ## GCS Output

    Results are saved to: `goal_setting/{steam_id}/{match_id}.json`

    Each match produces its own file, enabling tracking of how focus areas evolve over time.

    ## Base URLs

    | Environment | Base URL |
    |-------------|----------|
    | Dev | `https://goal-setting-dev-<hash>.a.run.app` |

    > Run `gcloud run services describe goal-setting-dev --region=asia-southeast1 --format='value(status.url)'`
    > to get the actual URL.

    ## Authentication

    - **Internal (pipeline):** IAM service-to-service with ID token (automatic)
    - **External:** `X-API-Key` header (Firestore-backed), same as other Mentoroid APIs

  version: 1.0.0
  contact:
    name: Mentoroid Team
    email: dev@mentoroid.ai
  license:
    name: Proprietary

servers:
  - url: https://goal-setting-dev-osoplb35na-as.a.run.app
    description: Goal Setting (Dev)

security:
  - ApiKeyAuth: []

tags:
  - name: Goal Setting
    description: |
      Generate personalized pre-game focus areas per role.

      **Type:** Cloud Run service (synchronous)
  - name: Health
    description: Service health check

paths:
  /goal-setting:
    post:
      tags:
        - Goal Setting
      summary: Generate focus areas
      description: |
        Generate personalized pre-game focus areas for a player's roles.

        ## Flow
        1. Resolve match_id (from request, or latest successful match from manifest)
        2. Validate roles (required query param — returns 400 if omitted)
        3. Read rank from player profile
        4. Load manifest and filter matches by role (last 20)
        5. If < 5 matches for a role: return static tips (no LLM)
        6. If >= 5 matches: load Stage 1 outputs, aggregate stats, generate via LLM
        7. Save result to GCS and return

        ## Roles
        - `roles` is **required** (1-2 roles). Returns 400 if omitted.
        - Valid roles: `carry`, `mid`, `offlane`, `soft_support`, `hard_support`

        ## Rank
        Rank is always read from the player's profile (`extracted_rank`), not from the request.
      operationId: generateGoalSetting
      parameters:
        - name: steam_id
          in: query
          required: true
          schema:
            type: string
          description: |
            Player's Steam64 ID (string to avoid JavaScript integer precision loss).
            Numeric-only, typically 17 digits.
          example: "76561198432333227"
        - name: roles
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 2
            items:
              type: string
              enum:
                - carry
                - mid
                - offlane
                - soft_support
                - hard_support
          description: |
            Roles to generate focus areas for (1-2). Repeat the param for multiple roles:
            `?roles=carry&roles=mid`. Required — the request returns 400 if omitted.
          example: ["carry", "mid"]
      responses:
        '200':
          description: Focus areas generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalSettingResponse'
              example:
                success: true
                steam_id: "76561198432333227"
                rank: "legend"
                goals:
                  carry:
                    focus_areas:
                      - "Focus on maintaining 60+ last hits by 10 minutes — your average is 48, well below the Legend benchmark of 62."
                      - "Reduce unnecessary deaths in the mid-game (15-25 min). You average 3.2 deaths in this window vs 2.1 benchmark."
                      - "Improve your net worth timing — aim for a 12-minute power spike item. Your average completion is 14:30."
                      - "Work on fight selection: your kill participation drops to 35% when behind, suggesting you take bad fights."
                    comfort_heroes:
                      - hero_name: "Anti-Mage"
                        games_played: 8
                      - hero_name: "Phantom Assassin"
                        games_played: 5
                      - hero_name: "Juggernaut"
                        games_played: 3
                    games_analyzed: 15
                    win_rate: 53.3
                    personalized: true
                  mid:
                    focus_areas:
                      - "Prioritize rune control — contest at least 4 of the first 6 bounty/water runes."
                      - "Your tower damage is 40% below benchmark. Look for split-push opportunities after winning fights."
                      - "Practice last-hitting under tower. Your CS drops 25% when pressured in lane."
                      - "Rotate to side lanes earlier. Your first rotation averages 12 minutes vs 9 min benchmark."
                    comfort_heroes:
                      - hero_name: "Invoker"
                        games_played: 5
                      - hero_name: "Storm Spirit"
                        games_played: 3
                      - hero_name: "Templar Assassin"
                        games_played: 2
                    games_analyzed: 8
                    win_rate: 62.5
                    personalized: true
                gcs_paths:
                  - "gs://mentoroid-pga-dev/userdata/dota2/goal_setting/76561198432333227/carry.json"
                  - "gs://mentoroid-pga-dev/userdata/dota2/goal_setting/76561198432333227/mid.json"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_steam_id:
                  summary: Missing steam_id
                  value:
                    error: "Missing required parameter: steam_id"
                    success: false
                invalid_role:
                  summary: Invalid role
                  value:
                    error: "Invalid role: jungle. Valid roles: carry, mid, offlane, soft_support, hard_support"
                    success: false
                no_roles:
                  summary: Missing roles parameter
                  value:
                    error: "Missing required parameter: roles. Provide at least one role, e.g., ?roles=carry"
                    success: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invalid API key. Include a valid X-API-Key header."
                success: false
        '404':
          description: Player data not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "No player data found for steam_id: 76561198432333227"
                success: false
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Method not allowed. Use POST."
                success: false
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Internal server error. Please try again later."
                success: false

  /goal-setting-pubsub:
    post:
      tags:
        - Goal Setting
      summary: Pub/Sub push endpoint
      description: |
        Accepts Pub/Sub push subscription messages. Unwraps the envelope and
        forwards to the main `/goal-setting` handler.

        **This is an internal endpoint** used by the Pub/Sub push subscription.
        External callers should use `POST /goal-setting` directly.

        ## Pub/Sub Envelope Format
        ```json
        {
          "message": {
            "data": "<base64-encoded JSON>",
            "messageId": "...",
            "publishTime": "..."
          },
          "subscription": "projects/.../subscriptions/..."
        }
        ```

        The base64-decoded `data` field must contain:
        ```json
        {
          "steam_id": "76561198432333227",
          "role": "carry"
        }
        ```
      operationId: goalSettingPubSub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PubSubEnvelope'
      responses:
        '200':
          description: Goal setting completed (same response as /goal-setting)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalSettingResponse'
        '400':
          description: Invalid Pub/Sub message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invalid Pub/Sub message: missing data"
                success: false

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: |
        Returns service health status. No authentication required.

        Used by Cloud Run health checks and monitoring.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                service: "goal-setting-v2"
                timestamp: "2026-02-25T10:30:00.000000Z"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for authentication. Obtained via Steam login on the Mentoroid app.
        Format: `mk_<32 hex chars>` (Steam auth) or `key-<32 hex chars>` (legacy admin).
        Validated against Firebase Firestore `api_keys` collection.

  schemas:
    GoalSettingResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        steam_id:
          type: string
          description: Player's Steam64 ID
          example: "76561198432333227"
        rank:
          type: string
          nullable: true
          description: Player's rank from profile (null if unavailable)
          enum: [herald, guardian, crusader, archon, legend, ancient, divine, immortal]
          example: "legend"
        goals:
          type: object
          description: |
            Focus areas per role. Keys are canonical role names.
          additionalProperties:
            $ref: '#/components/schemas/RoleGoal'
        gcs_paths:
          type: array
          description: GCS paths where each role's result was saved (one file per role)
          items:
            type: string
          example:
            - "gs://mentoroid-pga-dev/userdata/dota2/goal_setting/76561198432333227/carry.json"
            - "gs://mentoroid-pga-dev/userdata/dota2/goal_setting/76561198432333227/mid.json"

    RoleGoal:
      type: object
      properties:
        focus_areas:
          type: array
          description: |
            4 actionable focus areas for this role. Generated by LLM if personalized,
            or loaded from static tips if the player has < 5 matches for this role.
          items:
            type: string
          example:
            - "Focus on maintaining 60+ last hits by 10 minutes."
            - "Reduce unnecessary deaths in the mid-game."
            - "Improve your net worth timing for power spike items."
            - "Work on fight selection when behind."
        comfort_heroes:
          type: array
          description: |
            Top 3 most played heroes for this role, sorted by games played descending.
            Derived from the player's manifest match history.
          maxItems: 3
          items:
            type: object
            properties:
              hero_name:
                type: string
                description: Hero display name
                example: "Anti-Mage"
              games_played:
                type: integer
                description: Number of matches played with this hero in this role
                example: 8
          example:
            - hero_name: "Anti-Mage"
              games_played: 8
            - hero_name: "Phantom Assassin"
              games_played: 5
            - hero_name: "Juggernaut"
              games_played: 3
        games_analyzed:
          type: integer
          description: Number of matches analyzed for this role
          example: 15
        win_rate:
          type: number
          format: float
          description: Win rate for this role (only present when personalized=true)
          example: 53.3
        personalized:
          type: boolean
          description: |
            `true` if focus areas were generated by LLM from the player's match history.
            `false` if static tips were used (< 5 matches for this role).
          example: true
        data_available:
          type: boolean
          description: |
            Only present when `personalized=false` and no static tips could be loaded.
            Indicates the fallback data source is also unavailable.
          example: false

    PubSubEnvelope:
      type: object
      description: Standard Pub/Sub push subscription envelope
      properties:
        message:
          type: object
          properties:
            data:
              type: string
              format: byte
              description: Base64-encoded JSON payload
            messageId:
              type: string
            publishTime:
              type: string
              format: date-time
        subscription:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        service:
          type: string
          example: "goal-setting-v2"
        timestamp:
          type: string
          format: date-time
          example: "2026-02-25T10:30:00.000000Z"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        success:
          type: boolean
          example: false
